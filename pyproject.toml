[project]
name = "mcp-images"
version = "1.0.0"
description = "MCP server for raster image manipulation — Pillow + OpenCV"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp[cli]>=1.9",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
analysis = [
    "scikit-image>=0.24",
    "pyzbar>=0.1",
    "rembg[cpu]>=2.0",
]

[project.scripts]
mcp-images = "mcp_raster.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_raster"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

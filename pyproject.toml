[project]
name = "pi-mcp-images"
version = "1.0.0"
description = "MCP server for raster image manipulation — Pillow + OpenCV"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp[cli]>=1.9",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
]

[project.scripts]
mcp-raster = "mcp_raster.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_raster"]
